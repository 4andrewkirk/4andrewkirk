<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;background:#eef2ff;color:#17213a}main{width:100%;max-width:460px;padding:32px;background:white;border-radius:24px;box-shadow:0 16px 50px #243b6414}h1{margin:0 0 8px;font-size:28px}p{color:#64708a;line-height:1.5}label{display:block;margin:24px 0 8px;font-weight:600}input,button{width:100%;font:inherit;border-radius:12px}input{padding:14px;border:1px solid #bac3d5}input:focus{outline:3px solid #c7d2fe;border-color:#4f46e5}button{margin-top:12px;padding:14px;border:0;background:#4f46e5;color:white;font-weight:650;cursor:pointer}button:hover{background:#3730a3}button:focus-visible{outline:3px solid #a5b4fc;outline-offset:3px}#error{color:#b42318;margin-bottom:0}#result{text-align:center;margin-top:24px}canvas{max-width:100%;height:auto}#download{background:#e9edff;color:#3730a3}.hint{font-size:13px;margin-bottom:0}
</style>
</head>
<body>
<main>
<h1>Make a QR code</h1>
<p>Paste a link. Give people a quick way to open it.</p>
<form id="form">
<label for="url">Website URL</label>
<input id="url" type="text" inputmode="url" placeholder="https://example.com" autocomplete="url" required>
<button type="submit">Generate QR code</button>
</form>
<p id="error" role="alert" hidden></p>
<section id="result" aria-label="Generated QR code" hidden>
<canvas id="qr" role="img" aria-label="QR code for your link"></canvas>
<button id="download" type="button">Download PNG</button>
</section>
<p class="hint">Works offline. Your link stays in your browser. Supports links up to 106 bytes.</p>
</main>
<script>
/* Self-contained QR encoder: Version 5, error correction L. */
function makeQR(text) {
  const bytes = new TextEncoder().encode(text);
  if (bytes.length > 106) throw new Error('This link is too long. Try a shorter URL (up to 106 bytes).');
  const bits = [];
  function put(value, count) { for (let i=count-1;i>=0;i--) bits.push((value>>>i)&1); }
  put(4,4); put(bytes.length,8); bytes.forEach(b=>put(b,8));
  put(0,Math.min(4,864-bits.length));
  while(bits.length%8) bits.push(0);
  const data=[];
  for(let i=0;i<bits.length;i+=8){let value=0;for(let j=0;j<8;j++)value=(value<<1)|bits[i+j];data.push(value);}
  for(let i=0;data.length<108;i++)data.push(i%2?0x11:0xec);
  function multiply(a,b){let result=0;while(b){if(b&1)result^=a;a<<=1;if(a&256)a^=0x11d;b>>>=1;}return result;}
  let generator=[1],root=1;
  for(let i=0;i<26;i++){const next=Array(generator.length+1).fill(0);generator.forEach((v,j)=>{next[j]^=v;next[j+1]^=multiply(v,root);});generator=next;root=multiply(root,2);}
  const remainder=[...data,...Array(26).fill(0)];
  for(let i=0;i<data.length;i++){const factor=remainder[i];generator.forEach((v,j)=>{remainder[i+j]^=multiply(v,factor);});}
  const codewords=[...data,...remainder.slice(108)];
  const size=37,matrix=Array.from({length:size},()=>Array(size).fill(null));
  function finder(top,left){for(let y=-1;y<=7;y++){for(let x=-1;x<=7;x++){const r=top+y,c=left+x;if(r<0||c<0||r>=size||c>=size)continue;matrix[r][c]=(y>=0&&y<=6&&(x===0||x===6))||(x>=0&&x<=6&&(y===0||y===6))||(y>=2&&y<=4&&x>=2&&x<=4);}}}
  finder(0,0);finder(0,size-7);finder(size-7,0);
  for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)matrix[30+y][30+x]=Math.max(Math.abs(x),Math.abs(y))===2||(x===0&&y===0);
  for(let i=8;i<size-8;i++){matrix[6][i]=i%2===0;matrix[i][6]=i%2===0;}
  const format=0x77c4;
  for(let i=0;i<15;i++){const dark=((format>>>i)&1)===1;if(i<6)matrix[i][8]=dark;else if(i<8)matrix[i+1][8]=dark;else matrix[size-15+i][8]=dark;if(i<8)matrix[8][size-i-1]=dark;else if(i===8)matrix[8][7]=dark;else matrix[8][14-i]=dark;}
  matrix[size-8][8]=true;
  let bitIndex=0,upward=true;
  for(let right=size-1;right>0;right-=2){if(right===6)right--;for(let step=0;step<size;step++){const row=upward?size-1-step:step;for(let offset=0;offset<2;offset++){const col=right-offset;if(matrix[row][col]!==null)continue;let dark=false;if(bitIndex<codewords.length*8)dark=((codewords[bitIndex>>>3]>>>(7-bitIndex%8))&1)===1;matrix[row][col]=dark!==((row+col)%2===0);bitIndex++;}}upward=!upward;}
  return matrix;
}
const form=document.getElementById('form'),input=document.getElementById('url'),error=document.getElementById('error'),result=document.getElementById('result'),canvas=document.getElementById('qr');
input.addEventListener('input',()=>{result.hidden=true;error.hidden=true;});
form.addEventListener('submit',event=>{
  event.preventDefault();error.hidden=true;result.hidden=true;
  try{
    let link=input.value.trim();
    if(!/^[a-z][a-z0-9+.-]*:/i.test(link))link='https://'+link;
    let parsed;try{parsed=new URL(link);}catch{throw new Error('Please enter a website URL, like https://example.com.');}
    if(!['https:','http:'].includes(parsed.protocol)||!parsed.hostname)throw new Error('Please use a website link starting with http:// or https://.');
    const matrix=makeQR(parsed.href),scale=8,border=4;
    canvas.width=canvas.height=(matrix.length+border*2)*scale;
    const context=canvas.getContext('2d');context.fillStyle='#ffffff';context.fillRect(0,0,canvas.width,canvas.height);context.fillStyle='#000000';
    matrix.forEach((row,y)=>row.forEach((dark,x)=>{if(dark)context.fillRect((x+border)*scale,(y+border)*scale,scale,scale);}));
    canvas.setAttribute('aria-label','QR code for '+parsed.href);result.hidden=false;
  }catch(problem){error.textContent=problem.message;error.hidden=false;}
});
document.getElementById('download').addEventListener('click',()=>{const link=document.createElement('a');link.download='qr-code.png';link.href=canvas.toDataURL('image/png');link.click();});
</script>
</body>
</html>
